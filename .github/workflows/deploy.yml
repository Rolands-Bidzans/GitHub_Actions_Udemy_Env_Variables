name: Deployment
on:
  push:
    branches:
      - main
      - dev
env:
  MANGODB_DB_NAME: gha-demo
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    env:
      MONGODB_CLUSTER_ADDRESS: cluster0.unkhuhz.mongodb.net
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
#      MONGODB_USERNAME: rolandsnorigas
#      MONGODB_PASSWORD: NTPWluoXbeWFSaE7
      PORT: 8080
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Print secrets
        run: |
          echo "MONGODB_USERNAME: ${{ env.MANGODB_USERNAME }}"
          echo "MONGODB_DB_NAME: ${{ env.MANGODB_DB_NAME }}"
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      - name: Run tests
        run: npm test
      - name: Output information
        run: "echo \"MONGODB_USERNAME: ${{ env.MANGODB_USERNAME }}\""
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MANGODB_USERNAME }}"
          echo "MONGODB_DB_NAME: ${{ env.MANGODB_DB_NAME }}"
